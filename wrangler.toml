name = "zbi-url-shortener"
main = "api/worker.js"
compatibility_date = "2025-06-01"
workers_dev = true

# The docs page is imported as text, not parsed as a module.
rules = [
  { type = "Text", globs = ["**/*.html"], fallthrough = true }
]

# Serves /api on the same domain as the Pages site, so the site can link to
# "/api" and bots only ever need one hostname. This has to stay above [vars]:
# a key placed after that header belongs to the vars table, and wrangler will
# upload it as an env var named "routes" instead of registering the route.
#
# zone_name is the zone in the account, which is zbi.baby itself, not baby:
# the .baby apex belongs to the registry and a route cannot be attached there.
routes = [
  { pattern = "zbi.baby/api", zone_name = "zbi.baby" },
  { pattern = "zbi.baby/api/*", zone_name = "zbi.baby" }
]

[vars]
PUBLIC_URL = "https://zbi.baby"
MAX_URL_LENGTH = "2048"
