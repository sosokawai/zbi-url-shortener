name = "zbi-url-shortener"
main = "api/worker.js"
compatibility_date = "2025-06-01"
workers_dev = true

# The docs page is imported as text, not parsed as a module.
rules = [
  { type = "Text", globs = ["**/*.html"], fallthrough = true }
]

# The site is served by the worker as well as the api, so the whole of zbi.baby
# is one deployment and the hostname has a single owner. Nothing is shadowing
# anything else, and there is no zone name to get wrong.
[assets]
directory = "./docs"
binding = "ASSETS"
# The app is one document served on every path, and a qr link is read out of the
# path, so the path must survive untouched. The default auto-trailing-slash
# would rewrite 404.html to /404, which both redirects and loses the payload.
html_handling = "none"

[vars]
PUBLIC_URL = "https://zbi.baby"
MAX_URL_LENGTH = "2048"
