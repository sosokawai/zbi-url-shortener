server {
  listen 80;
  server_name zbi.baby www.zbi.baby;
  root /usr/share/nginx/html;
  index 404.html;
  charset utf-8;

  gzip on;
  gzip_types application/javascript text/javascript text/html;
  gzip_min_length 1024;

  # The api is a separate node service, stateless and dependency free. The
  # upstream is resolved through docker's dns on a timer, so the api container
  # can be recreated with a new address without reloading nginx.
  resolver 127.0.0.11 valid=10s ipv6=off;

  location /api {
    set $api_upstream "api:3000";
    proxy_pass http://$api_upstream$request_uri;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 30s;
  }

  # The app is a single page: every path serves the same document, which reads
  # the compressed link from the fragment (or the path, for QR codes). Real
  # files (main.js, compress.js, logo.png, ...) are served as-is.
  #
  # Nothing is cached hard here. This document is the app, and so are the
  # images it points at, so a deploy that changes either would otherwise stay
  # invisible in a browser for the length of the max-age. no-cache still means
  # a conditional request, so repeat visits get a cheap 304.
  location / {
    try_files $uri $uri/ /404.html;
    add_header Cache-Control "no-cache" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
  }
}
